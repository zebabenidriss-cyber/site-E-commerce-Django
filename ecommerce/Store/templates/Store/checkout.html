{% extends 'Store/base.html' %}

{% block content %} 

<div class="mb-4">
  <h3>Produits commandés <span id="cart-count"></span></h3>
  <ul id="cart-products" class="list-group">
    <li class="list-group-item">Aucun produit commandé.</li>
  </ul>
</div>

<form method="POST">
  {% csrf_token %}
  <div class="form-row">
    <div class="form-group col-md-6">
      <label for="inputEmail4">Nom</label>
      <input type="text" class="form-control" id="nom" name="nom" placeholder="Nom">
    </div>
    <div class="form-group col-md-6">
      <label for="inputPassword4">Email</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="email@example.com">
    </div>
  </div>
  <div class="form-group">
    <label for="inputAddress">Address</label>
    <input type="text" class="form-control" id="adresse" name="adresse" placeholder="1234 Main St">
  </div>
  <div class="form-row">
    <div class="form-group col-md-6">
      <label for="inputCity">Ville</label>
      <input type="text" class="form-control" id="ville" name="ville" placeholder="Ouagadougou">
    </div>
    <div class="form-group col-md-4">
      <label for="inputState">Pays</label>
      <select id="pays" name="pays" class="form-control">
        <option selected>Burkina Faso</option>
        <option>Côte d'Ivoire</option>
        <option>Mali</option>
        <option>Niger</option>
        <option>Sénégal</option>
        <option>Cameroun</option>
      </select>
    </div>
    <div class="form-group col-md-2">
      <label for="inputZip">Zip</label>
      <input name="zip_code" id="zip_code" type="text" class="form-control">
    </div>
  </div>
  <div class="form-group">
  <input type="hidden" name="items" id="items">
  <button type="submit" class="btn btn-primary">Commander</button>
</form>

{% endblock %}

{% block js %}
{{ products|json_script:"products-data" }}
<script>
  const products = JSON.parse(document.getElementById('products-data').textContent);
  const cart = JSON.parse(localStorage.getItem('panier') || '{}');
  const productsById = Object.fromEntries(products.map(product => [String(product.id), product]));
  const cartProducts = document.getElementById('cart-products');
  const cartCount = document.getElementById('cart-count');
  document.getElementById('items').value = JSON.stringify(cart);
  const entries = Object.entries(cart)
    .map(([id, quantity]) => [productsById[id], Number(quantity)])
    .filter(([product, quantity]) => product && quantity > 0);

  cartCount.textContent = entries.length ? `(${entries.length})` : '';
  cartProducts.innerHTML = '';

  if (entries.length === 0) {
    cartProducts.innerHTML = '<li class="list-group-item">Aucun produit commandé.</li>';
  } else {
    entries.forEach(([product, quantity]) => {
      const item = document.createElement('li');
      item.className = 'list-group-item d-flex justify-content-between align-items-center';
      item.textContent = `${product.title} x${quantity}`;

      const price = document.createElement('span');
      price.textContent = `${product.price} FCFA`;
      item.appendChild(price);
      cartProducts.appendChild(item);
    });
  }
</script>
{% endblock %}
